# SIMVEA_h on every ECG of the batch (arm T6W), added after T6. Design: docs/augmentation_sweep.md.
#
# T6 augmented A1's half of the batch, like T1-T5; the paper augments every ECG. T6W is T6 with the whole
# batch augmented, so T6W - T6 isolates the share, as S3 - A1 and E1 - A3 do in the sweep. The sweep's and
# T6's test claims are spent, and a claim never takes another trial, so T6W gets its own protocol. Everything
# but the arm is the sweep's: data, pool, model, optimizer, batch, seeds, validation cadence and the
# 10,000-step budget. SYNTIDE's random streams are keyed by seed, step and slot, never by arm or protocol, so
# T6W's seed s starts from the same weights as the sweep's seed s and sees the same ECGs in the same order.
# In the slots T6 augmented, T6W draws the same leads, pairs, alpha and beta. It is paired with the finished
# A0, A1, S3 and T6 runs, which are not re-run.
#
# Reported, written before training: T6W - T6 (the share) and T6W - A0, on all, noisy and clean records, per
# class, on validation and test, with CIs from the sweep's frozen bootstrap (rules 7329468ebc8d: 2,000 draws,
# seed 0). Also shown: T6W - A1 and T6W - S3 (standard augmentation on every ECG). Diagnostics, like every
# other technique: the test fold was viewed before, so nothing here is a fresh claim.
#
# Plan:   python -m syntide.generate protocol=ptbxl_aug_simvea_whole mode=plan
# Train:  python -m syntide_trainers.torch_loop "runs/ptbxl-aug-simvea-whole/*/*/seed*"      (about 20 min on MPS)
# Test:   python -m syntide.eval.holdout runs/ptbxl-aug-simvea-whole                        (claims T6W's 3 trials)
# CIs:    python -m syntide.eval.across runs/ptbxl-aug-sweep runs/ptbxl-aug-simvea runs/ptbxl-aug-simvea-whole \
#             --split val|test --contrast T6W-T6 --contrast T6W-A0 --contrast T6W-A1 --contrast T6W-S3
# Plot:   python -m syntide.eval.aug_figure runs/ptbxl-aug-sweep runs/ptbxl-aug-simvea runs/ptbxl-aug-simvea-whole \
#             --split val|test --hide S4
#         python -m syntide.eval.arms_figure runs/ptbxl-aug-sweep runs/ptbxl-aug-simvea runs/ptbxl-aug-simvea-whole \
#             --hide S4
id: ptbxl-aug-simvea-whole
registry: datasets/timenet-registry
dataset: physionet/ptb-xl@1.0.3

batch_size: 64
val_every: 100
transform_fraction: 0.5    # the sweep's; T6W sets its own

# The sweep's envelopes, unchanged. No arm here uses them; they keep the protocol checks identical.
generic:
  gain: [0.9, 1.1]
  max_shift_s: 0.5
  noise_rms_mv: [0.0, 0.1]
  wander_mv: [0.0, 3.5]
  wander_hz: [0.05, 0.7]
editor:
  mv_limit: 10.0
  alignment_tol: 0.15
  max_retries: 5
  type_smoothing: 0.1
  density_floor: 1.0
  envelope:
    baseline_drift: {amplitude_mv: [0.1, 3.5], freq_hz: [0.1, 0.4]}
    static_noise: {amplitude_mv: [0.005, 0.1]}
    burst_noise: {amplitude_mv: [0.01, 0.6], duration_s: [0.5, 3.0]}

arms:
  # T6's SIMVEA_h (Lim et al. 2025) at the paper's random hyperparameters, on every ECG of the batch: each of
  # V2-V5 is replaced with probability 1/2 by alpha * (beta * X_j + (2 - beta) * X_z), a pair (j, z) of chest
  # leads on either side of it, alpha in {0.1, ..., 1.0}, beta in {0.0, ..., 2.0}. Labels unchanged.
  # Expected: the paper's setting. Risk: standard augmentation lost 0.009 going from half to every ECG (S3 - A1).
  T6W:
    source_role: depleted
    transform_family: simvea
    sampling_policy: fixed
    transform_fraction: 1.0
    simvea: {alpha: [0.1, 1.0], beta: [0.0, 2.0], step: 0.1, lead_p: 0.5}

regimes:
  scarcity50:
    manifest: manifests/ptbxl-artifact-50/pool50.json
    max_steps: 10000
    arms: [T6W]

seeds: [0, 1, 2]
