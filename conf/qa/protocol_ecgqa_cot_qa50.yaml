# Five data arms x two supervision modes x three seeds, every setting the same as the RunPod baseline:
# its split and selection subset, 15,531 updates of 16 examples, validation every 1,000 updates,
# first-argmax selection on val/qa_accuracy, the strict Answer: parser. Model, tokenizer, optimizer and
# decoding belong to the trainer config (recorded in its fingerprint) and must be identical across arms.
#   uv run python -m syntide.generate.qa plan-trials --protocol conf/qa/protocol_ecgqa_cot_qa50.yaml
id: ecgqa-cot-qa50
corpora:
  real_qa: outputs/qa/real_qa
  paraphrase: outputs/qa/paraphrase
  grounded: outputs/qa/grounded
  acquisition: outputs/qa/acquisition
  generated: outputs/qa/generated
selection: outputs/qa/selection
arms:
  real_qa: {corpora: [real_qa]}                                                 # 1. original real QA (the baseline)
  paraphrase: {corpora: [real_qa, paraphrase]}                                  # 2. + paraphrases
  grounded: {corpora: [real_qa, grounded]}                                      # 3. + grounded expansion
  grounded_acq: {corpora: [real_qa, grounded, acquisition]}                     # 4. + acquisition variation
  grounded_acq_gen: {corpora: [real_qa, grounded, acquisition, generated]}      # 5. + generated waveforms
supervision: [rationale, answer_only]
seeds: [0, 1, 2]
batch_size: 16          # examples per optimizer update (the baseline: 8 x 2 accumulation)
max_steps: 15531        # the baseline's three passes over the 82,829 real rows
val_every: 1000
curriculum:             # uniform passes over every corpus row, as the baseline's loader
  name: uniform-passes@1
  seed: 0
  stages: [{name: all}]
decoding:
  selection: option-nll           # the baseline's selection: rank the allowed options, emit "Answer: <option>"
  reporting: greedy               # held-out suites: greedy generation
  max_new_tokens: 384
  max_length: 1536
  prompt_version: ecgqa-cot-single-joint-media-v1
budget:
  primary: "15,531 optimizer updates x 16 examples, for every arm"
  note: "equal updates are not equal compute: compare exposure.json token counts across arms"
