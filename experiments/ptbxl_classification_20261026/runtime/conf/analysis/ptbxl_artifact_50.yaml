# Decision rules for ptbxl-artifact-50. Frozen with `python -m syntide.eval mode=freeze` before the test fold is
# claimed; frozen rules are never replaced. Unqualified arms are those of `regime`; C2@full100 is C2 trained on
# every training patient, the 100% target.
regime: scarcity50
reference: A1                     # results-table deltas are against standard augmentation
primary: [A3, A1]                 # targeted editor vs standard augmentation, artifact slice
sequence: [[A3, A2], [A2, A1]]    # targeting within the editor, then the two augmentation recipes
sequence_regimes: [scarcity50]
diagnostics:                      # reported, never evidence
  - [A1, A0]                      # standard augmentation vs none
  - [C1, A0]                      # natural artifact coverage at matched N
  - [C2, A0]                      # every ECG of the 50% pool vs the depleted pool
  - [C2@full100, A0]              # every training patient vs the depleted 50% pool
  - [C2@full100, C2]              # doubling real data: 100% vs 50% of the patients
practical_target: 0.02
noninferiority_margin: -0.01
gap_gate: {contrast: [C1, A0], min_effect: 0.02}
gap_closed:
  - {name: natural mix, target: C1, baseline: A0, gated: true}
  - {name: 100% of patients, target: C2@full100, baseline: A0, gated: false}
n_boot: 2000
ci_level: 0.95
bootstrap_seed: 0
