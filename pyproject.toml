[project]
name = "syntide"
version = "0.1.0"
description = "SYNTIDE: a synthetic data engine for temporal AI (PTB-XL artifact experiment)"
readme = "README.md"
# Hydra 1.3 crashes on Python 3.14 (stricter argparse rejects its help object), so stay on 3.13.
requires-python = ">=3.13,<3.14"
dependencies = [
    "timenet[cli,torch]==0.11.0",
    "timenet-connectors==0.11.0",
    "hydra-core>=1.3.7,<1.4",
    "lightning==2.6.*",
    "tensorboard>=2.21",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "matplotlib>=3.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14",
    "wfdb>=4.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "syntide"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
